name: Deploy blog to raicco.cn

# 触发方式：
#   push 到 main        → 自动构建并部署
#   手动触发            → Actions 页面点 "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署；新的 push 会取消进行中的旧任务
concurrency:
  group: deploy-blog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: node build.js

      # 写入部署标记。用途见 Verify deployment 一步：
      # 它是"这次部署到底有没有生效"的唯一可信证据。
      - name: Write deploy marker
        run: |
          {
            echo "commit=${{ github.sha }}"
            echo "run=${{ github.run_number }}"
            echo "built_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > dist/deployed.txt
          cat dist/deployed.txt

      - name: Verify build output
        run: |
          echo "构建产物："
          find dist -type f | sort
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known_hosts
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "known_hosts configured from secret"
          else
            echo "SSH_KNOWN_HOSTS not set; will use StrictHostKeyChecking=accept-new"
          fi

      - name: Deploy via rsync
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # -a  archive: recursive + preserve times/symlinks
          # -c  compare by checksum instead of size+mtime
          # -z  compress in transit
          # --delete  remove server files that no longer exist locally
          #
          # --chmod sets explicit target permissions (D=dir, F=file).
          # Without it, -a copies the source modes, which for Windows-derived
          # artifacts are 666/777 -- world-writable, wrong for a web root.
          #
          # IMPORTANT: do NOT chown -R the target to www-data afterwards.
          # That takes write permission away from the deploy user, so the NEXT
          # deploy fails with rsync exit 23 (partial transfer due to error) when
          # it tries to delete or overwrite files it no longer owns.
          # www-data only needs to READ this tree, so rsync's own permissions
          # plus a readable directory are sufficient.
          set +e
          rsync -acz --delete --chmod=D755,F644 \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/blog/"
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            echo "::error::rsync exited with code $rc"
            case $rc in
              23) echo "23 = partial transfer due to error (usually permission denied on target files)";;
              12) echo "12 = protocol/data stream error";;
              11) echo "11 = file I/O error";;
              10) echo "10 = socket I/O error";;
              5)  echo "5  = client-server protocol error";;
              3)  echo "3  = errors selecting input files";;
            esac
            echo "--- target directory state ---"
            ssh -o StrictHostKeyChecking=accept-new \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "ls -la /var/www/blog/ | head -20; echo; id" || true
            exit $rc
          fi
          echo "rsync completed with exit code 0"

      # www-data only needs read access. If an earlier deploy left the tree owned
      # by another account, fix ownership -- but only on the directory entry
      # (non-recursive) so the deploy user keeps write permission for next time.
      - name: Ensure web server can read the tree
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo chown www-data:www-data /var/www/blog && sudo find /var/www/blog -type d -exec chmod 755 {} +"
          echo "web root is readable by www-data"

      # 真正的验证：把本次提交写入的标记文件从公网取回并核对。
      #
      # 为什么不只检查 HTTP 200：
      #   站点早就上线了，HTTP 200 只能证明"站点活着"，
      #   无法证明"本次 rsync 真的生效了"。那是假阳性。
      #   核对 deployed.txt 里的 commit 才能证明整条链路打通。
      - name: Verify deployment
        run: |
          echo "期望 commit: ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            body=$(curl -s --max-time 15 -H 'Cache-Control: no-cache' \
                   "https://blog.raicco.cn/deployed.txt?cb=$RANDOM" || true)
            echo "--- 尝试 $i ---"
            echo "$body"
            if echo "$body" | grep -q "${{ github.sha }}"; then
              echo "验证通过：线上 deployed.txt 与本次提交一致"
              exit 0
            fi
            sleep 5
          done
          echo "验证失败：线上 deployed.txt 未包含本次 commit"
          echo "可能原因：rsync 目标路径错误、权限问题、或 CDN/浏览器缓存"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## 部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 站点 | https://blog.raicco.cn |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| 触发方式 | ${{ github.event_name }} |"
            echo "| 状态 | ${{ job.status }} |"
          } >> $GITHUB_STEP_SUMMARY
