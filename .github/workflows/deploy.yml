name: Deploy blog to raicco.cn

# 触发方式：
#   push 到 main        → 自动构建并部署
#   手动触发            → Actions 页面点 "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署；新的 push 会取消进行中的旧任务
concurrency:
  group: deploy-blog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SITE: blog
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: node build.js

      # 部署标记文件。它是"这次部署到底有没有生效"的唯一可信证据：
      # Verify 步骤会从公网把它取回来，核对 commit 是否与本次提交一致。
      - name: Write deploy marker
        run: |
          {
            echo "commit=${{ github.sha }}"
            echo "run=${{ github.run_number }}"
            echo "built_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > dist/deployed.txt
          cat dist/deployed.txt

      - name: Verify build output
        run: |
          echo "构建产物："
          find dist -type f | sort
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known_hosts
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "known_hosts configured from secret"
          else
            echo "SSH_KNOWN_HOSTS not set; using StrictHostKeyChecking=accept-new"
          fi

      # 把产物打包上传到服务器暂存目录。
      #
      # 为什么用 tar 而不是直接 rsync：
      #   部署流程包含「内容同步 + 权限规范化」两步，两者顺序不能错。
      #   真正的逻辑放在服务器上的 /usr/local/bin/deploy-static-site，
      #   所有部署路径（Actions、本地脚本）共用同一份实现，
      #   避免某一边漏掉权限处理导致 rsync 退出码 23。
      #
      #   历史教训：曾把 chown -R www-data 直接写在 workflow 里，
      #   结果目录属主变成 www-data，部署用户失去写权限，
      #   第一次成功、之后每次都失败。
      - name: Upload artifacts to staging
        run: |
          tar czf /tmp/site.tgz -C dist .
          scp -o StrictHostKeyChecking=accept-new \
            /tmp/site.tgz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/site-${SITE}.tgz"

      # 远端激活脚本单独上传成文件再执行。
      #
      # 为什么不在 "ssh ... \"set -e; ...\"" 里直接内联：
      #   那会形成 YAML -> bash -> ssh 三层引号嵌套，$(mktemp)、$STAGE 之类
      #   要在三种展开规则下同时正确，非常容易踩坑（本项目已因此出过多次问题）。
      #   写成文件后，远端执行的只是一个无参数的脚本，没有转义风险。
      #
      # 为什么用 printf 逐行生成而不是 heredoc：
      #   YAML 的 run: | 块内每一行都带前导缩进，heredoc 会把这些空格
      #   一并写进脚本内容（<<- 才剥缩进，但也只剥 TAB）。printf 不受影响。
      - name: Upload activate script
        run: |
          printf '%s\n' \
            'set -e' \
            'SITE="$1"' \
            'STAGE=$(mktemp -d)' \
            'trap "rm -rf $STAGE" EXIT' \
            'tar xzf "/tmp/site-${SITE}.tgz" -C "$STAGE"' \
            'sudo /usr/local/bin/deploy-static-site "$SITE" "$STAGE"' \
            'rm -f "/tmp/site-${SITE}.tgz"' \
            > /tmp/activate.sh
          echo "--- activate.sh ---"
          cat /tmp/activate.sh
          bash -n /tmp/activate.sh && echo "syntax ok"
          scp -o StrictHostKeyChecking=accept-new \
            /tmp/activate.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/activate.sh"

      - name: Activate deployment
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash /tmp/activate.sh ${SITE} && rm -f /tmp/activate.sh"

      # 真正的验证：把本次提交写入的标记文件从公网取回并核对。
      #
      # 为什么不只检查 HTTP 200：
      #   站点早已上线，200 只能证明"站点活着"，
      #   无法证明"本次部署真的生效了"。那是假阳性。
      #   核对 deployed.txt 里的 commit 才能证明整条链路打通。
      - name: Verify deployment
        run: |
          echo "期望 commit: ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            body=$(curl -s --max-time 15 -H 'Cache-Control: no-cache' \
                   "https://blog.raicco.cn/deployed.txt?cb=$RANDOM" || true)
            echo "--- 尝试 $i ---"
            echo "$body"
            if echo "$body" | grep -q "${{ github.sha }}"; then
              echo "验证通过：线上 deployed.txt 与本次提交一致"
              exit 0
            fi
            sleep 5
          done
          echo "验证失败：线上 deployed.txt 未包含本次 commit"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## 部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 站点 | https://blog.raicco.cn |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| 触发方式 | ${{ github.event_name }} |"
            echo "| 状态 | ${{ job.status }} |"
          } >> $GITHUB_STEP_SUMMARY
